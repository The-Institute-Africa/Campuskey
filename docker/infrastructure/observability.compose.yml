services:
  prometheus:
    image: prom/prometheus:latest
    container_name: campuskey-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ../configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - campuskey-net

  grafana:
    image: grafana/grafana:latest
    container_name: campuskey-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - campuskey-grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - campuskey-net

  loki:
    image: grafana/loki:latest
    container_name: campuskey-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    networks:
      - campuskey-net

  promtail:
    image: grafana/promtail:latest
    container_name: campuskey-promtail
    restart: unless-stopped
    volumes:
      - ../configs/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
    depends_on:
      - loki
    networks:
      - campuskey-net

volumes:
  campuskey-grafana-data:

networks:
  campuskey-net:
    name: campuskey-net
