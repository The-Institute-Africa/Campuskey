services:
  database:
    image: mysql:8.0
    container_name: campuskey-database
    restart: unless-stopped
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-campuskey_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-campuskey}
      MYSQL_USER: ${MYSQL_USER:-campuskey}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-campuskey_password}
    volumes:
      - campuskey-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - campuskey-net

volumes:
  campuskey-db-data:

networks:
  campuskey-net:
    name: campuskey-net
