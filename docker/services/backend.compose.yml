services:
  backend:
    build:
      context: ../../backend/campuskey-backend
      dockerfile: ../../docker/Dockerfile.backend
      args:
        SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
    image: ${BACKEND_IMAGE:-campuskey-backend:latest}
    container_name: campuskey-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:mysql://database:3306/campuskey}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-campuskey}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-campuskey_password}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "code=$$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/actuator/health); [ \"$$code\" = \"200\" ] || [ \"$$code\" = \"401\" ]",
        ]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - campuskey-net

networks:
  campuskey-net:
    name: campuskey-net
