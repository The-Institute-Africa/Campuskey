# Test profile defaults for Spring Boot context loading
spring.datasource.url=jdbc:h2:mem:campuskeytest;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.session.jdbc.initialize-schema=always
spring.sql.init.mode=never

frontend.url=http://localhost:5173

spring.app.jwtSecret=test-jwt-secret-test-jwt-secret-test-jwt-secret
spring.app.jwtExpirationMs=3600000

spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test@example.com
spring.mail.password=test-password
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false


