# Database
spring.datasource.url=${CAMPUSKEY_DB_URL}
spring.datasource.username=${CAMPUSKEY_DB_USERNAME}
spring.datasource.password=${CAMPUSKEY_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Local development defaults; use validated migrations before production.
spring.jpa.hibernate.ddl-auto=${CAMPUSKEY_JPA_DDL_AUTO:update}
spring.jpa.show-sql=${CAMPUSKEY_SQL_LOGGING:false}
spring.jpa.properties.hibernate.format_sql=${CAMPUSKEY_SQL_LOGGING:false}

server.error.include-message=${CAMPUSKEY_ERROR_INCLUDE_MESSAGE:never}
spring.session.jdbc.initialize-schema=always

spring.app.jwtSecret=${CAMPUSKEY_JWT_SECRET}
spring.app.jwtExpirationMs=3600000

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB
spring.servlet.multipart.location=/tmp/uploads
server.tomcat.max-swallow-size=100MB

logging.level.org.springframework.security=${CAMPUSKEY_SECURITY_LOG_LEVEL:INFO}

frontend.url=${CAMPUSKEY_FRONTEND_URL:http://localhost:5173}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${CAMPUSKEY_MAIL_USERNAME}
spring.mail.password=${CAMPUSKEY_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
