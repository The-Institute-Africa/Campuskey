spring.datasource.url=jdbc:h2:mem:campuskey-demo;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=false

spring.mail.host=${CAMPUSKEY_MAIL_HOST:localhost}
spring.mail.port=${CAMPUSKEY_MAIL_PORT:1025}
spring.mail.username=${CAMPUSKEY_MAIL_USERNAME:demo}
spring.mail.password=${CAMPUSKEY_MAIL_PASSWORD:demo}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

campuskey.demo-data.enabled=${CAMPUSKEY_DEMO_DATA_ENABLED:false}
campuskey.demo-data.student-password=${CAMPUSKEY_DEMO_STUDENT_PASSWORD:}
campuskey.demo-data.landlord-password=${CAMPUSKEY_DEMO_LANDLORD_PASSWORD:}
