name: AI Model Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate-evaluation-artifacts:
    name: Validate AI Evaluation Artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          paths = [
              Path('ai-models/evaluation/test-case.json'),
              Path('ai-models/evaluation/benchmark-results.json'),
          ]
          for path in paths:
              with path.open('r', encoding='utf-8') as handle:
                  json.load(handle)
              print(f'Validated {path}')
          PY
